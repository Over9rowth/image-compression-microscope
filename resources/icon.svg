<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd4e8"/>
      <stop offset="1" stop-color="#3a8fa8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="10" y="10" width="236" height="236" rx="40" fill="none" stroke="#2a3746" stroke-width="2"/>

  <!-- 刻度：仪器感 -->
  <g stroke="#33465a" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="34" x2="40" y2="46"/>
    <line x1="64" y1="34" x2="64" y2="42"/>
    <line x1="88" y1="34" x2="88" y2="46"/>
    <line x1="112" y1="34" x2="112" y2="42"/>
    <line x1="216" y1="210" x2="216" y2="222"/>
    <line x1="192" y1="214" x2="192" y2="222"/>
    <line x1="168" y1="210" x2="168" y2="222"/>
  </g>

  <!-- 透镜 -->
  <circle cx="112" cy="110" r="52" fill="none" stroke="url(#lens)" stroke-width="10"/>
  <circle cx="112" cy="110" r="52" fill="#7fd4e8" opacity="0.06"/>
  <line x1="150" y1="148" x2="188" y2="186" stroke="url(#lens)" stroke-width="14" stroke-linecap="round"/>

  <!-- 压缩：两侧向内箭头 + 中间收窄的像素带 -->
  <g fill="#e8eef5">
    <rect x="88" y="96" width="48" height="6" rx="3"/>
    <rect x="96" y="107" width="32" height="6" rx="3"/>
    <rect x="104" y="118" width="16" height="6" rx="3"/>
  </g>
  <g stroke="#f2a65a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M78 100 L70 110 L78 120"/>
    <path d="M146 100 L154 110 L146 120"/>
  </g>
</svg>
